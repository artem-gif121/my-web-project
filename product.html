<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ÉLORIA — Товар</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(circle at 10% 10%, rgba(184, 151, 92, .08), transparent 30%),
                linear-gradient(135deg, #fffdf9, #f8f3eb);
            color: #29241f;
            font-family: "Montserrat", sans-serif;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .eloria-header {
            width: 100%;
            padding: 25px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(255,255,255,.88);
            backdrop-filter: blur(14px);

            border-bottom: 1px solid rgba(120,90,50,.12);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: "Cormorant Garamond", serif;
            font-size: 35px;
            letter-spacing: 7px;
            color: #9b7844;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .back-link,
        .cart-link {
            border: 1px solid #d9c5a5;
            background: #fffdf9;
            padding: 12px 18px;
            border-radius: 30px;
            transition: .3s;
            font-size: 13px;
        }

        .back-link:hover,
        .cart-link:hover {
            background: #b18a50;
            color: white;
            transform: translateY(-2px);
        }

        .cart-link {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -7px;

            min-width: 22px;
            height: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #9b7844;
            color: white;
            font-size: 11px;
            font-weight: 600;
        }

        .product-wrapper {
            width: min(1250px, 92%);
            margin: 65px auto 90px;
        }

        .product-box {
            display: grid;
            grid-template-columns: 1fr 1fr;

            background: rgba(255,255,255,.86);

            border: 1px solid rgba(160,130,90,.18);
            border-radius: 35px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(80,60,35,.10);
        }

        .product-image-area {
            min-height: 650px;
            background: #f1ebe1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 35px;
            position: relative;
        }

        .product-image-area::before {
            content: "ÉLORIA";

            position: absolute;
            top: 30px;
            left: 35px;

            font-family: "Cormorant Garamond", serif;
            font-size: 17px;
            letter-spacing: 5px;
            color: #a6875b;
        }

        .product-image {
            width: 100%;
            height: 590px;
            object-fit: cover;

            border-radius: 25px;

            box-shadow:
                0 20px 45px rgba(50,40,25,.18);
        }

        .product-info {
            padding: 70px 65px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-category {
            color: #a38353;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 11px;
            margin-bottom: 20px;
        }

        .product-number {
            color: #b99b6c;
            font-family: "Cormorant Garamond", serif;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .product-title {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(42px, 5vw, 65px);
            line-height: .95;
            font-weight: 500;
            color: #302a24;
            margin-bottom: 12px;
        }

        .product-subtitle {
            font-family: "Cormorant Garamond", serif;
            font-size: 23px;
            color: #8d7657;
            margin-bottom: 28px;
        }

        .product-description {
            color: #6e665e;
            line-height: 1.9;
            font-size: 14px;
            margin-bottom: 35px;
            max-width: 500px;
        }

        .product-divider {
            width: 70px;
            height: 1px;
            background: #c9a66e;
            margin-bottom: 30px;
        }

        .product-price {
            font-family: "Cormorant Garamond", serif;
            font-size: 40px;
            color: #9b7844;
            margin-bottom: 30px;
        }

        .buy-area {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .quantity {
            height: 52px;
            display: flex;
            align-items: center;

            border: 1px solid #d7c4a5;
            border-radius: 30px;

            overflow: hidden;
            background: #fffdf9;
        }

        .quantity button {
            width: 45px;
            height: 52px;

            border: 0;
            background: transparent;

            font-size: 18px;
            color: #80633e;

            cursor: pointer;
        }

        .quantity button:hover {
            background: #eee5d8;
        }

        .quantity span {
            width: 35px;
            text-align: center;
            font-size: 14px;
        }

        .add-cart-btn {
            height: 52px;

            border: none;
            border-radius: 30px;

            padding: 0 30px;

            background: linear-gradient(
                135deg,
                #a88655,
                #806038
            );

            color: white;

            font-family: "Montserrat", sans-serif;
            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            box-shadow: 0 10px 25px rgba(130,100,55,.22);

            transition: .3s;
        }

        .add-cart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(130,100,55,.28);
        }

        .added-message {
            margin-top: 18px;
            color: #75805c;
            font-size: 13px;
            opacity: 0;
            transform: translateY(5px);
            transition: .3s;
        }

        .added-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .not-found {
            text-align: center;
            padding: 100px 20px;
        }

        .not-found i {
            font-size: 55px;
            color: #b18a50;
            margin-bottom: 25px;
        }

        .not-found h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: 50px;
            margin-bottom: 20px;
        }

        .not-found p {
            color: #777;
            margin-bottom: 30px;
        }

        @media (max-width: 850px) {

            .product-box {
                grid-template-columns: 1fr;
            }

            .product-image-area {
                min-height: auto;
                padding: 20px;
            }

            .product-image {
                height: 430px;
            }

            .product-info {
                padding: 45px 30px;
            }

            .eloria-header {
                padding: 18px 4%;
            }

            .logo {
                font-size: 27px;
                letter-spacing: 4px;
            }

            .back-link {
                display: none;
            }

        }

        @media (max-width: 500px) {

            .product-wrapper {
                width: 94%;
                margin-top: 25px;
            }

            .product-image {
                height: 350px;
            }

            .product-info {
                padding: 35px 23px;
            }

            .product-title {
                font-size: 42px;
            }

            .buy-area {
                flex-direction: column;
                align-items: stretch;
            }

            .quantity {
                justify-content: center;
            }

            .add-cart-btn {
                width: 100%;
            }
        }

        /* =========================================================
   ÉLORIA — LUXURY PRODUCT TABS
========================================================= */

.product-tabs {
    margin-top: 55px;
    padding-top: 38px;
    border-top: 1px solid rgba(155, 120, 68, 0.16);
}


/* =========================================================
   HEADER TABS
========================================================= */

.tabs-header {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;

    margin-bottom: 38px;

    border-bottom: 1px solid #e8dece;
}

.tab-btn {
    position: relative;

    border: none;
    background: transparent;

    padding: 16px 32px 18px;

    color: #8c8071;

    font-family: "Montserrat", sans-serif;
    font-size: 11px;
    font-weight: 400;

    letter-spacing: 2px;
    text-transform: uppercase;

    cursor: pointer;

    transition:
        color .3s ease,
        transform .3s ease;
}

.tab-btn::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -1px;

    width: 0;
    height: 2px;

    background: linear-gradient(
        90deg,
        #9b7844,
        #d5b77f,
        #9b7844
    );

    transform: translateX(-50%);

    transition: width .4s ease;
}

.tab-btn:hover {
    color: #9b7844;
}

.tab-btn.active {
    color: #9b7844;
    font-weight: 500;
}

.tab-btn.active::after {
    width: 65%;
}


/* =========================================================
   CONTENT
========================================================= */

.tab-content {
    display: none;

    animation: eloriaTabAnimation .5s ease;
}

.tab-content.active {
    display: block;
}

@keyframes eloriaTabAnimation {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================================================
   DESCRIPTION
========================================================= */

.tab-description-wrap {
    max-width: 820px;

    margin: 0 auto;

    text-align: center;

    padding: 10px 20px 20px;
}

.tab-description-label {
    color: #b18a50;

    font-size: 9px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 18px;
}

.tab-description {
    color: #665e55;

    font-family: "Cormorant Garamond", serif;

    font-size: 24px;

    line-height: 1.75;

    font-weight: 400;
}

.tab-description-line {
    width: 55px;
    height: 1px;

    background: #c9a66e;

    margin: 25px auto 0;
}


/* =========================================================
   CHARACTERISTICS
========================================================= */

.product-characteristics {
    max-width: 850px;

    margin: 0 auto;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 15px;
}

.characteristic-item {
    position: relative;

    min-height: 105px;

    padding: 24px 25px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.95),
            rgba(249,244,236,.95)
        );

    border: 1px solid rgba(185,155,108,.20);

    border-radius: 18px;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}

.characteristic-item::before {
    content: "";

    position: absolute;

    left: 0;
    top: 22px;
    bottom: 22px;

    width: 2px;

    background: linear-gradient(
        180deg,
        transparent,
        #c5a36e,
        transparent
    );

    opacity: .7;
}

.characteristic-item:hover {
    transform: translateY(-4px);

    border-color: rgba(168,134,85,.42);

    box-shadow:
        0 15px 35px rgba(70,50,30,.08);
}

.characteristic-item span {
    display: block;

    margin-bottom: 7px;

    color: #a38353;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: 2.5px;
}

.characteristic-item strong {
    color: #40372f;

    font-family: "Cormorant Garamond", serif;

    font-size: 22px;

    line-height: 1.2;

    font-weight: 500;
}


/* =========================================================
   REVIEWS
========================================================= */

.reviews-heading {
    text-align: center;

    margin-bottom: 25px;
}

.reviews-heading span {
    display: block;

    color: #b18a50;

    font-size: 9px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 8px;
}

.reviews-heading h3 {
    color: #40372f;

    font-family: "Cormorant Garamond", serif;

    font-size: 31px;

    font-weight: 500;
}

.product-reviews {
    max-width: 850px;

    margin: 0 auto;

    display: grid;

    gap: 16px;
}

.review-card {
    position: relative;

    padding: 25px 28px;

    background: rgba(255,255,255,.76);

    border: 1px solid rgba(185,155,108,.19);

    border-radius: 20px;

    box-shadow:
        0 8px 25px rgba(70,50,30,.035);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.review-card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 15px 35px rgba(70,50,30,.08);
}

.review-card::after {
    content: "“";

    position: absolute;

    top: 4px;
    right: 20px;

    color: rgba(177,138,80,.13);

    font-family: "Cormorant Garamond", serif;

    font-size: 72px;

    line-height: 1;
}

.review-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 14px;
}

.review-author {
    display: flex;

    align-items: center;

    gap: 12px;
}

.review-avatar {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #d9c19b,
            #a88655
        );

    color: white;

    font-family: "Cormorant Garamond", serif;

    font-size: 19px;
}

.review-name {
    color: #40372f;

    font-size: 12px;

    font-weight: 500;

    margin-bottom: 3px;
}

.review-date {
    color: #a0978c;

    font-size: 9px;
}

.review-stars {
    color: #b18a50;

    font-size: 10px;

    letter-spacing: 2px;
}

.review-text {
    color: #70675e;

    font-size: 13px;

    line-height: 1.85;

    max-width: 730px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    .product-tabs {
        margin-top: 40px;
        padding-top: 30px;
    }

    .tabs-header {
        justify-content: flex-start;

        overflow-x: auto;

        scrollbar-width: none;
    }

    .tabs-header::-webkit-scrollbar {
        display: none;
    }

    .tab-btn {
        padding: 14px 18px;

        white-space: nowrap;
    }

    .tab-description {
        font-size: 20px;
    }

    .product-characteristics {
        grid-template-columns: 1fr;
    }

    .review-top {
        align-items: flex-start;

        flex-direction: column;

        gap: 10px;
    }

}


/* ÉLORIA — КНОПКА УЛЮБЛЕНИХ ТОВАРІВ */

.favorite-product-btn {
    width: 52px;
    height: 52px;
    flex-shrink: 0;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #d7c4a5;
    border-radius: 50%;

    background: #fffdf9;
    color: #9b7844;

    font-size: 21px;
    cursor: pointer;

    transition: .3s;
}

.favorite-product-btn:hover {
    background: #f1e7d8;

}

.favorite-product-btn.is-favorite {

    color: #fff;
    border-color: #9b7844;

.favorite-product-btn i {
    pointer-events: none;
}

.favorite-product-btn:focus-visible {
    outline: 2px solid #9b7844;

.favorite-product-message {
    margin-top: 12px;
    color: #8d7657;
    font-size: 12px;
    min-height: 18px;
}

</style>

<header class="eloria-header">

    <a href="index.html" class="logo">
        ÉLORIA
    </a>

                0
            </span>

        </a>

</header>

    <div id="productContainer"></div>

</main>

<script src="product.js"></script>
<script>
    
/* =========================================
   ÉLORIA — УЛЮБЛЕНИЙ ТОВАР НА PRODUCT.HTML
========================================= */

(function () {
    const STORAGE_KEY = "eloriaFavorites";

    function getFavorites() {
        try {
            const data = JSON.parse(
                localStorage.getItem(STORAGE_KEY) || "[]"
            );

            return Array.isArray(data) ? data : [];
        } catch (error) {
            return [];
        }
    }

    function saveFavorites(items) {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(items)
        );
    }

    function getCurrentProduct() {
        const params = new URLSearchParams(location.search);
        const id = params.get("id");

        if (!id || typeof getProductById !== "function") {
            return null;
        }

        const product = getProductById(id);

        if (!product) return null;

        return {
            id: String(product.id || id),
            name: product.name || "",
            ukrainianName: product.ukrainianName || "",
            price: product.price || "",
            image: product.image || product.img || "",
            description: product.description || ""
        };
    }

    function updateButton() {
        const button = document.querySelector(
            ".favorite-product-btn"
        );

        if (!button) return;

        const product = getCurrentProduct();

        if (!product) return;

        const favorites = getFavorites();

        const isFavorite = favorites.some(
            item => String(item.id) === product.id
        );

        button.classList.toggle("is-favorite", isFavorite);
        button.setAttribute("aria-pressed", String(isFavorite));

        button.innerHTML = isFavorite
            ? '<i class="fa-solid fa-heart"></i>'
            : '<i class="fa-regular fa-heart"></i>';

        button.title = isFavorite
            ? "Видалити з улюбленого"
            : "Додати в улюблене";

        button.setAttribute(
            "aria-label",
            button.title
        );
    }

    function addFavoriteButton() {
        const buyArea = document.querySelector(
            "#productContainer .buy-area"
        );

        if (!buyArea) return;

        if (buyArea.querySelector(".favorite-product-btn")) {
            updateButton();
            return;
        }

        const button = document.createElement("button");

        button.type = "button";
        button.className = "favorite-product-btn";
        button.setAttribute("aria-label", "Додати в улюблене");
        button.innerHTML = '<i class="fa-regular fa-heart"></i>';

        const cartButton = buyArea.querySelector(".add-cart-btn");

        if (cartButton) {
            cartButton.insertAdjacentElement("afterend", button);
        } else {
            buyArea.appendChild(button);
        }

        button.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();

            const product = getCurrentProduct();

            if (!product) return;

            const favorites = getFavorites();

            const index = favorites.findIndex(
                item => String(item.id) === product.id
            );

            const message = document.querySelector(
                ".favorite-product-message"
            );

            if (index !== -1) {
                favorites.splice(index, 1);

                if (message) {
                    message.textContent =
                        "Товар видалено з улюбленого";
                }
            } else {
                favorites.push(product);

                if (message) {
                    message.textContent =
                        "Товар додано в улюблене ❤️";
                }
            }

            saveFavorites(favorites);
            updateButton();
        });

        const message = document.createElement("p");
        message.className = "favorite-product-message";
        message.setAttribute("aria-live", "polite");

        buyArea.insertAdjacentElement("afterend", message);

        updateButton();
    }

    function init() {
        addFavoriteButton();
        updateButton();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }

    /*
     * product.js може створювати картку товару
     * із невеликою затримкою.
     */
    let attempts = 0;

    const timer = setInterval(function () {
        init();
        attempts++;

        if (
            document.querySelector(
                "#productContainer .favorite-product-btn"
            ) ||
            attempts >= 30
        ) {
            clearInterval(timer);
        }
    }, 200);

    window.addEventListener("pageshow", updateButton);

    window.addEventListener("storage", function (event) {
        if (event.key === STORAGE_KEY) {
            updateButton();
        }
    });
})();
</script>
<script>

/* =========================================================
   ÉLORIA — PRODUCT TABS
   Опис + Характеристики + Унікальні відгуки
========================================================= */


/* =========================================================

/* =========================================================
   СТВОРЕННЯ HTML ВІДГУКІВ
========================================================= */

function createEloriaReviews(product) {

    const reviews =
        ELORIA_PRODUCT_REVIEWS[product.id] || [];

    if (reviews.length === 0) {

        return `
            <div class="no-reviews">
                Поки що відгуків немає.
            </div>
        `;

    }

    return reviews.map(function(review) {

        const initial =
            review.name.charAt(0).toUpperCase();

        return `
            <article class="review-card">

                <div class="review-top">

                    <div class="review-author">

                        <div class="review-avatar">
                            ${initial}
                        </div>

                        <div>

                            <div class="review-name">
                                ${review.name}
                            </div>

                            <span class="review-date">
                                Відгук про ${product.name}
                            </span>

                        </div>

                    </div>

                    <div class="review-stars">
                        ★★★★★
                    </div>

                </div>

                <p class="review-text">
                    ${review.text}
                </p>

            </article>
        `;

    }).join("");

}


/* =========================================================
   СТВОРЕННЯ ВКЛАДОК
========================================================= */

function createEloriaProductTabs() {

    const productContainer =
        document.getElementById("productContainer");

    if (!productContainer) {
        return false;
    }


    const productBox =
        productContainer.querySelector(".product-box");

    if (!productBox) {
        return false;
    }


    /* Якщо вкладки вже створені — нічого не робимо */

    if (productBox.querySelector(".product-tabs")) {
        return true;
    }


    /* Отримуємо ID товару */

    const params =
        new URLSearchParams(window.location.search);

    const productId =
        params.get("id");


    if (!productId) {
        console.warn("ÉLORIA: product ID not found");
        return false;
    }


    /* Отримуємо товар */

    if (typeof getProductById !== "function") {

        console.warn(
            "ÉLORIA: getProductById is not loaded yet"
        );

        return false;
    }


    const product =
        getProductById(productId);


    if (!product) {

        console.warn(
            "ÉLORIA: product not found:",
            productId
        );

        return false;
    }


    /* Характеристики */

    const characteristics =
        getEloriaCharacteristics(product);


    /* Відгуки */

    const reviews =
        createEloriaReviews(product);


    /* Створюємо блок */

    const tabs =
        document.createElement("section");

    tabs.className =
        "product-tabs";


    tabs.innerHTML = `

        <!-- =========================
             TABS HEADER
        ========================== -->

        <div class="tabs-header">

            <button
                type="button"
                class="tab-btn active"
                data-tab="eloria-description">

                Опис

            </button>


            <button
                type="button"
                class="tab-btn"
                data-tab="eloria-characteristics">

                Характеристики

            </button>


            <button
                type="button"
                class="tab-btn"
                data-tab="eloria-reviews">

                Відгуки

            </button>

        </div>


        <!-- =========================
             DESCRIPTION
        ========================== -->

        <div
            id="eloria-description"
            class="tab-content active">

            <div class="tab-description-wrap">

                <div class="tab-description-label">
                    ÉLORIA • DESCRIPTION
                </div>

                <div class="tab-description">
                    ${product.description}
                </div>

                <div class="tab-description-line"></div>

            </div>

        </div>


        <!-- =========================
             CHARACTERISTICS
        ========================== -->

        <div
            id="eloria-characteristics"
            class="tab-content">

            <div class="product-characteristics">


                <div class="characteristic-item">

                    <span>
                        Вага / об'єм
                    </span>

                    <strong>
                        ${characteristics.weight}
                    </strong>

                </div>


                <div class="characteristic-item">

                    <span>
                        Тип
                    </span>

                    <strong>
                        ${characteristics.productType}
                    </strong>

                </div>


                <div class="characteristic-item">

                    <span>
                        Кількість на порцію
                    </span>

                    <strong>
                        ${characteristics.portion}
                    </strong>

                </div>


                <div class="characteristic-item">

                    <span>
                        Термін зберігання
                    </span>

                    <strong>
                        ${characteristics.storage}
                    </strong>

                </div>


            </div>

        </div>


        <!-- =========================
             REVIEWS
        ========================== -->

        <div
            id="eloria-reviews"
            class="tab-content">

            <div class="reviews-heading">

                <span>
                    ÉLORIA • CLIENTS
                </span>

                <h3>
                    Враження наших гостей
                </h3>

            </div>


            <div class="product-reviews">

                ${reviews}

            </div>

        </div>

    `;


    productBox.appendChild(tabs);


    /* =====================================================
       ПЕРЕМИКАННЯ ВКЛАДОК
    ===================================================== */

    const tabButtons =
        tabs.querySelectorAll(".tab-btn");

    const tabContents =
        tabs.querySelectorAll(".tab-content");


    tabButtons.forEach(function(button) {

        button.addEventListener(
            "click",
            function() {


                /* Прибираємо active */

                tabButtons.forEach(
                    function(item) {

                        item.classList.remove("active");

                    }
                );


                tabContents.forEach(
                    function(item) {

                        item.classList.remove("active");

                    }
                );


                /* Додаємо active */

                button.classList.add("active");


                const tabId =
                    button.getAttribute("data-tab");


                const selected =
                    tabs.querySelector("#" + tabId);


                if (selected) {

                    selected.classList.add("active");

                }

            }
        );

    });


    return true;

}


/* =========================================================
   ОЧІКУВАННЯ ЗАВАНТАЖЕННЯ ТОВАРУ
========================================================= */

function startEloriaProductTabs() {

    let attempts = 0;

    const maxAttempts = 30;


    const timer =
        setInterval(function() {

            attempts++;


            const created =
                createEloriaProductTabs();


            if (created || attempts >= maxAttempts) {

                clearInterval(timer);

            }

        }, 200);

}


/* =========================================================
   ЗАПУСК
========================================================= */

if (document.readyState === "loading") {

    document.addEventListener(
        "DOMContentLoaded",
        startEloriaProductTabs
    );

} else {

    startEloriaProductTabs();

}
document.addEventListener("DOMContentLoaded", function () {
    const STORAGE_KEY = "eloriaFavorites";

    function getFavorites() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
            return [];
        }
    }

    function saveFavorites(favorites) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
    }

    function updateFavoriteButtons() {
        const favorites = getFavorites();

        document.querySelectorAll(".drink-card[data-id]").forEach(card => {
            const id = card.dataset.id;
            const button = card.querySelector(".eloria-favorite-btn");

            if (!button) return;

            const isFavorite = favorites.some(item => item.id === id);

            button.classList.toggle("is-favorite", isFavorite);
            button.setAttribute("aria-pressed", String(isFavorite));

            button.innerHTML = isFavorite
                ? '<i class="fa-solid fa-heart"></i>'
                : '<i class="fa-regular fa-heart"></i>';
        });

        document.querySelectorAll("[data-favorites-count]").forEach(counter => {
            counter.textContent = favorites.length;
        });
    }

    document.querySelectorAll(".eloria-favorite-btn").forEach(button => {
        button.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();

            const card = button.closest(".drink-card");
            if (!card) return;

            const id = card.dataset.id;
            const image = card.querySelector("img");
            const name = card.querySelector("h3");
            const price = card.querySelector(".drink-price");
            const ukrainianName = card.querySelector(".ukrainian-name");
            const paragraphs = card.querySelectorAll("p:not(.ukrainian-name)");

            let favorites = getFavorites();
            const existingIndex = favorites.findIndex(item => item.id === id);

            if (existingIndex !== -1) {
                favorites.splice(existingIndex, 1);
            } else {
                favorites.push({
                    id: id,
                    name: name ? name.textContent.trim() : id,
                    ukrainianName: ukrainianName
                        ? ukrainianName.textContent.trim()
                        : "",
                    price: price ? price.textContent.trim() : "",
                    image: image ? image.getAttribute("src") : "",
                    description: paragraphs.length
                        ? paragraphs[0].textContent.trim()
                        : ""
                });
            }

            saveFavorites(favorites);
            updateFavoriteButtons();
        });
    });

    updateFavoriteButtons();
});
</script>
