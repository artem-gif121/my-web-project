    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #fffaf8;
            color: #503938;
            font-family: 'Montserrat', sans-serif;
        }


        /* =====================================================
           MEMBER PAGE
        ===================================================== */

        .member-page {

            min-height: 100vh;

            padding:
                70px 20px 90px;

            background:
                linear-gradient(
                    180deg,
                    #fffaf8 0%,
                    #fdf3ef 100%
                );
        }


        .member-shell {

            max-width: 1180px;

            margin: 0 auto;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .member-back {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            color: #8f6264;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 28px;

            transition: .25s ease;
        }


        .member-back:hover {

            color: #6f494b;

            transform:
                translateX(-4px);
        }


        /* =====================================================
           HERO
        ===================================================== */

        .member-hero {

            position: relative;

            overflow: hidden;

            display: grid;

            grid-template-columns:
                390px 1fr;

            gap: 55px;

            padding: 38px;

            background:
                rgba(255,255,255,.86);

            border:
                1px solid
                rgba(158,112,113,.16);

            border-radius: 30px;

            box-shadow:
                0 22px 55px
                rgba(113,76,70,.10);
        }


        .member-hero::before {

            content: 'ÉLORIA';

            position: absolute;

            top: 15px;

            right: 30px;

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 55px;

            color:
                rgba(158,112,113,.07);

            font-weight: 700;
        }


        /* =====================================================
           PHOTO
        ===================================================== */

        .member-photo-wrap {

            position: relative;

            z-index: 1;
        }


        .member-photo {

            width: 100%;

            aspect-ratio: 4 / 5;

            object-fit: cover;

            display: block;

            border-radius: 24px;

            box-shadow:
                0 18px 38px
                rgba(87,57,54,.16);

            background: #eee0da;
        }


        .member-photo-label {

            position: absolute;

            left: 18px;

            bottom: 18px;

            padding:
                9px 14px;

            border-radius: 30px;

            background:
                rgba(255,255,255,.93);

            color: #80585a;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1.2px;
        }


        /* =====================================================
           INTRO
        ===================================================== */

        .member-intro {

            position: relative;

            z-index: 1;

            align-self: center;

            padding: 10px 0;
        }


        .member-kicker {

            color: #a06f70;

            font-size: 12px;

            letter-spacing: 2.8px;

            font-weight: 700;

            text-transform: uppercase;

            margin-bottom: 12px;
        }


        .member-intro h1 {

            margin: 0 0 8px;

            color: #4b3533;

            font-family:
                'Cormorant Garamond',
                serif;

            font-size:
                clamp(48px, 6vw, 78px);

            line-height: .9;

            font-weight: 700;
        }


        .member-role {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            margin:
                10px 0 24px;

            color: #8f6264;

            font-size: 14px;

            font-weight: 600;
        }


        .member-role i {

            color: #a67677;
        }


        .member-short {

            max-width: 650px;

            color: #735b58;

            line-height: 1.9;

            font-size: 15px;

            margin-bottom: 25px;
        }


        /* =====================================================
           FACTS
        ===================================================== */

        .member-facts {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 12px;
        }


        .member-fact {

            padding:
                15px 16px;

            border-radius: 16px;

            background: #fff8f5;

            border:
                1px solid
                rgba(158,112,113,.13);
        }


        .member-fact span {

            display: block;

            color: #aa8584;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1.3px;

            font-weight: 700;

            margin-bottom: 5px;
        }


        .member-fact strong {

            color: #5b4140;

            font-size: 13px;

            line-height: 1.5;

            font-weight: 600;
        }


        /* =====================================================
           STORY SECTION
        ===================================================== */

        .member-story {

            margin-top: 28px;

            display: grid;

            grid-template-columns:
                1.15fr .85fr;

            gap: 25px;
        }


        .story-card {

            padding: 32px;

            border-radius: 25px;

            background:
                rgba(255,255,255,.88);

            border:
                1px solid
                rgba(158,112,113,.13);

            box-shadow:
                0 15px 38px
                rgba(113,76,70,.07);
        }


        .story-title {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 22px;
        }


        .story-title-icon {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            display: grid;

            place-items: center;

            color: #9e7071;

            background: #faece8;
        }


        .story-title h2 {

            margin: 0;

            color: #503938;

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 31px;

            font-weight: 700;
        }


        /* =====================================================
           HISTORY
        ===================================================== */

        .history-item {

            padding-bottom: 20px;

            margin-bottom: 20px;

            border-bottom:
                1px solid
                #f0dfdb;
        }


        .history-item:last-child {

            border-bottom: none;

            padding-bottom: 0;

            margin-bottom: 0;
        }


        .history-item strong {

            display: block;

            color: #5b4140;

            font-size: 14px;

            margin-bottom: 7px;
        }


        .history-item p {

            margin: 0;

            color: #735b58;

            font-size: 13px;

            line-height: 1.8;
        }


        /* =====================================================
           WORK EXPERIENCE
        ===================================================== */

        .experience-list {

            margin: 0;

            padding: 0;

            list-style: none;
        }


        .experience-list li {

            position: relative;

            padding:
                0 0 22px 27px;

            color: #735b58;

            font-size: 13px;

            line-height: 1.75;

            border-left:
                1px solid
                #e5c8c3;
        }


        .experience-list li:last-child {

            padding-bottom: 0;

            border-left-color:
                transparent;
        }


        .experience-list li::before {

            content: '';

            position: absolute;

            left: -5px;

            top: 4px;

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #b27d7f;

            box-shadow:
                0 0 0 4px
                #fff5f1;
        }


        .experience-list strong {

            display: block;

            color: #5b4140;

            margin-bottom: 4px;
        }


        /* =====================================================
           QUOTE
        ===================================================== */

        .member-quote {

            margin-top: 25px;

            padding:
                25px 30px;

            border-radius: 22px;

            background: #9e7071;

            color: white;

            box-shadow:
                0 15px 35px
                rgba(120,77,78,.18);
        }


        .member-quote i {

            opacity: .65;

            font-size: 22px;

            margin-bottom: 10px;
        }


        .member-quote p {

            margin: 0;

            font-family:
                'Cormorant Garamond',
                serif;

            font-size: 24px;

            line-height: 1.35;
        }


        /* =====================================================
           FOOTER TEXT
        ===================================================== */

        .member-footer {

            text-align: center;

            margin-top: 42px;

            color: #9b7774;

            font-size: 12px;

            letter-spacing: 1.5px;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .member-error {

            max-width: 650px;

            margin: 80px auto;

            text-align: center;

            padding: 45px;

            background: white;

            border-radius: 25px;

            box-shadow:
                0 20px 50px
                rgba(113,76,70,.10);
        }


        .member-error h1 {

            font-family:
                'Cormorant Garamond',
                serif;

            color: #503938;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            .member-hero,
            .member-story {

                grid-template-columns: 1fr;
            }


            .member-photo-wrap {

                max-width: 520px;

                margin: 0 auto;

                width: 100%;
            }

        }


        @media (max-width: 600px) {

            .member-page {

                padding:
                    35px 14px 60px;
            }


            .member-hero {

                padding: 20px;

                border-radius: 22px;

                gap: 25px;
            }


            .member-facts {

                grid-template-columns: 1fr;
            }


            .story-card {

                padding: 24px;
            }


            .member-quote p {

                font-size: 21px;
            }

        }

    </style>

</head>
